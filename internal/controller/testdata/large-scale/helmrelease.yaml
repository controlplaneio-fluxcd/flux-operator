# Sample normalized from monitoring/kube-prometheus-stack on the staging cluster.
# The test rewrites metadata.name, metadata.namespace and metadata.uid.
# status.inventory is in the stored {id, v} shape so the reporter exercises
# workload extraction; the MCP tool expands it from the Helm storage secret.
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  annotations:
    reconcile.fluxcd.io/forceAt: '2026-05-16T18:18:32.803507213Z'
    reconcile.fluxcd.io/requestedAt: '2026-05-16T18:18:32.803507213Z'
  labels:
    resourceset.fluxcd.controlplane.io/name: kube-prometheus-stack
    resourceset.fluxcd.controlplane.io/namespace: monitoring
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  driftDetection:
    ignore:
    - paths:
      - /metadata/annotations/prometheus-operator-validated
      target:
        kind: PrometheusRule
    mode: enabled
  install:
    crds: Create
    timeout: 9m
  interval: 1h
  postRenderers:
  - kustomize:
      patches:
      - patch: "- op: add\n  path: \"/metadata/labels/app.fluxcd.io~1component\"\n\
          \  value: \"metrics\"\n- op: add\n  path: \"/metadata/labels/d2.fluxcd.controlplane.io~1scrape\"\
          \n  value: \"Enabled\"\n"
        target:
          kind: ServiceMonitor
  serviceAccountName: flux
  upgrade:
    crds: CreateReplace
    timeout: 9m
  values:
    alertmanager:
      enabled: false
    grafana:
      assertNoLeakedSecrets: false
      defaultDashboardsEnabled: false
      grafana.ini:
        auth.generic_oauth:
          api_url: https://dex.staging.flux-d2.com/userinfo
          auth_url: https://dex.staging.flux-d2.com/auth
          auto_login: true
          enabled: true
          name: Dex
          role_attribute_path: contains(groups, 'controlplaneio-fluxcd:maintainers')
            && 'Editor' || 'Viewer'
          scopes: openid offline_access email profile groups
          token_url: https://dex.staging.flux-d2.com/token
          use_refresh_token: true
        server:
          root_url: https://grafana.staging.flux-d2.com
        users:
          allow_sign_up: false
          auto_assign_org: true
          auto_assign_org_role: Viewer
      route:
        main:
          enabled: true
          hostnames:
          - grafana.staging.flux-d2.com
          parentRefs:
          - name: cluster
            namespace: ingress
            sectionName: https
    prometheus:
      prometheusSpec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: app.fluxcd.io/role
                  operator: In
                  values:
                  - control-plane
        podMonitorNamespaceSelector: {}
        podMonitorSelector:
          matchLabels:
            d2.fluxcd.controlplane.io/scrape: Enabled
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
        retention: 24h
        serviceMonitorNamespaceSelector: {}
        serviceMonitorSelector:
          matchLabels:
            d2.fluxcd.controlplane.io/scrape: Enabled
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 100Gi
        tolerations:
        - effect: NoSchedule
          key: app.fluxcd.io/role
          operator: Equal
          value: control-plane
  valuesFrom:
  - kind: Secret
    name: grafana
